openapi: 3.1.0
info:
  title: Mulan-Scout Public API
  version: 0.2.0
  description: |
    Browser-facing contract for the current project-centered Mulan-Scout product.
    The contract covers the four fixed analysis capabilities (SBOM, vulnerability,
    license and health), delivery history, audit, expert review, platform operations
    and notifications. A missing assessment must be represented as unavailable or
    not evaluated; it must never be converted into a zero-risk result.
  license:
    name: MulanPSL-2.0
    identifier: MulanPSL-2.0
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /me:
    get:
      operationId: getMe
      summary: Get current identity and permissions
      responses:
        '200':
          description: Current user and resource scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      summary: Get the permission-filtered dashboard snapshot
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: repository_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Dashboard snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects:
    get:
      operationId: listProjects
      summary: List projects visible to the current user
      description: Returns an unwrapped array without pagination, including active projects and archived projects before their deletion deadline. Search and status filtering are currently performed by the client.
      responses:
        '200':
          description: Visible projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createProject
      summary: Create a project
      description: Creates an active project with version 1 and null archive timestamps. Names are unique across active and archived projects after trim, NFKC normalization, and lowercase comparison. Duplicate names return 409 duplicate_project. Server-side validation is required independently of the client.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
            example:
              name: Developer tools
              owner: Engineering
              description: Frontend and backend repositories
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProject
      summary: Get one project and its computed coverage counters
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      summary: Edit, archive, or restore a project
      description: |
        Requires name, owner, description and the version last read by the client;
        status is optional and defaults to the current status. Returns the complete
        updated Project, not a 204 response or a data envelope.
        A successful update increments version once; a stale version returns
        409 project_version_conflict without modifying data.
        Archiving requires no queued or running repository synchronization or
        analysis tasks (409 project_busy otherwise). The server sets archived_at
        and scheduled_deletion_at to its current UTC time and that time plus 90 days.
        Archived projects reject ordinary edits and repeated archive requests with
        409 project_archived. Restoring before the deadline clears both timestamps,
        cancels the old deletion and unsent notification jobs, and retains existing
        data. It does not start synchronization or analysis automatically.
        At or after the deadline, business access and restore return 404 project_not_found,
        even if physical cleanup is still pending. Restore and cleanup must be serialized.
        Duplicate names return 409 duplicate_project; invalid input returns 422.
        The current frontend does not expose manual permanent deletion. The
        reserved DELETE operation below remains available for a future controlled
        administration workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateInput' }
            examples:
              edit:
                summary: Save project information
                value: { name: Developer tools, owner: Engineering, description: Frontend and backend repositories, version: 3, status: active }
              archive:
                summary: Archive using the last saved fields and version
                value: { name: Developer tools, owner: Engineering, description: Frontend and backend repositories, version: 3, status: archived }
              restore:
                summary: Restore after reading the archived project at version 4
                value: { name: Developer tools, owner: Engineering, description: Frontend and backend repositories, version: 4, status: active }
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: permanentlyDeleteProject
      summary: Permanently delete a project through the reserved backend API
      description: |
        Reserved for a future controlled administration workflow. The current
        frontend must not display a button or call this operation.
        Permanently removes the project and its repository connections, analysis
        tasks, runs, SBOM data, governance results, artifacts, and local snapshots.
        Immutable audit records are retained after deletion. Returns 409 project_busy
        while repository synchronization or analysis work is queued or running. The
        operation cannot be undone.
      responses:
        '204':
          description: Project and associated local records permanently deleted
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /repositories:
    get:
      operationId: listRepositories
      summary: List repository connections in one project
      parameters:
        - name: project_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Repository connections for the selected project
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRepository
      summary: Create one repository connection and its asynchronous sync job
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Reusing the key returns the original repository and job instead of creating duplicates.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRepositoryInput' }
      responses:
        '202':
          description: Repository connection and sync job accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRepositoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /repositories/{repository_id}:
    parameters:
      - name: repository_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRepository
      summary: Get one repository connection
      responses:
        '200':
          description: Repository connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateRepositoryNote
      summary: Update the local note for one repository connection
      description: Only description may change. Compare expected_description atomically with the stored note to prevent overwriting another user's edit. Archived projects are read-only. This does not change upstream repository metadata or trigger synchronization or analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRepositoryNoteInput' }
      responses:
        '200':
          description: Updated repository connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Repository' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: deleteRepository
      summary: Delete an unused repository connection
      description: Deletion is rejected while a sync is active or when analysis, SBOM, or governance history exists.
      responses:
        '204': { description: Repository connection deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /repositories/{repository_id}/refresh:
    parameters:
      - name: repository_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: refreshRepository
      summary: Start a new repository synchronization job
      responses:
        '202':
          description: Synchronization accepted
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /repositories/{repository_id}/inventory:
    parameters:
      - name: repository_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getRepositoryInventory
      summary: Get the latest successful repository inventory
      responses:
        '200':
          description: Latest successful inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Inventory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getJob
      summary: Get one asynchronous repository job
      responses:
        '200':
          description: Job state and progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/runs:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectRuns
      summary: List lightweight run summaries in a project
      parameters:
        - $ref: '#/components/parameters/RunView'
      responses:
        '200':
          description: Runs ordered newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Run' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/analyses:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectAnalyses
      summary: List project-level analysis batches
      responses:
        '200':
          description: Analysis batches
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectAnalysis' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createProjectAnalysis
      summary: Start one fixed analysis module for one to twenty repositories
      description: The browser submits one request per selected module. Repositories must belong to the project and be ready.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalysisInput' }
      responses:
        '202':
          description: Analysis batch accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAnalysis' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}/analyses/{analysis_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: analysis_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProjectAnalysis
      summary: Get one project-level analysis batch
      responses:
        '200':
          description: Analysis batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAnalysis' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/analysis-settings:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getProjectAnalysisSettings
      summary: Get automatic analysis rules for the four fixed capabilities
      responses:
        '200':
          description: Current project analysis settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAnalysisSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProjectAnalysisSettings
      summary: Replace automatic analysis rules for a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectAnalysisSettingsInput' }
      responses:
        '200':
          description: Updated project analysis settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAnalysisSettings' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /repositories/{repository_id}/runs:
    parameters:
      - { $ref: '#/components/parameters/RepositoryId' }
    get:
      operationId: listRepositoryRuns
      summary: List lightweight run summaries for one repository
      parameters:
        - $ref: '#/components/parameters/RunView'
      responses:
        '200':
          description: Repository runs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Run' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createRepositoryRun
      summary: Start one fixed analysis module for one repository
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunInput' }
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /modules:
    get:
      operationId: listModules
      summary: List the four platform-managed analysis modules
      description: Users cannot register, replace, or delete modules. The stable module names are sbom-generator, vulnerability-scanner, license-scanner and health-evaluator.
      responses:
        '200':
          description: Fixed module definitions
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ModuleDefinition' } }
  /modules/{module_id}:
    parameters:
      - { $ref: '#/components/parameters/ModuleId' }
    get:
      operationId: getModule
      summary: Get one platform-managed module definition
      responses:
        '200':
          description: Module definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{module_id}/health:
    parameters:
      - { $ref: '#/components/parameters/ModuleId' }
    get:
      operationId: getModuleHealth
      summary: Get the service health of one fixed module
      responses:
        '200':
          description: Module service health
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleHealth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /modules/{module_id}/enable:
    parameters:
      - { $ref: '#/components/parameters/ModuleId' }
    post:
      operationId: enableModule
      summary: Enable one platform-managed module
      responses:
        '200':
          description: Updated module
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }
  /modules/{module_id}/disable:
    parameters:
      - { $ref: '#/components/parameters/ModuleId' }
    post:
      operationId: disableModule
      summary: Disable one platform-managed module
      responses:
        '200':
          description: Updated module
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleDefinition' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runs/{run_id}:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
    get:
      operationId: getRun
      summary: Get a run summary by default
      description: Large input and response fields are omitted from the summary view and loaded from dedicated endpoints.
      parameters:
        - $ref: '#/components/parameters/RunView'
      responses:
        '200':
          description: Run state and summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '404': { $ref: '#/components/responses/NotFound' }
  /runs/{run_id}/inputs:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
    get:
      operationId: getRunInputs
      summary: Page through the input files selected for a run
      parameters:
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: One page of run inputs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunInputPage' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /runs/{run_id}/response:
    parameters:
      - { $ref: '#/components/parameters/RunId' }
    get:
      operationId: getRunResponse
      summary: Get the bounded raw response preview for a run
      responses:
        '200':
          description: Response preview and metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunResponsePreview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts/{artifact_id}/download:
    parameters:
      - name: artifact_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: downloadArtifact
      summary: Download a persisted input or output artifact
      responses:
        '200':
          description: Stored artifact bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }
  /sboms:
    get:
      operationId: listSboms
      summary: List completed SBOM results
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: repository_id, in: query, schema: { type: string } }
        - { name: scope, in: query, schema: { type: string, enum: [project, repository] } }
      responses:
        '200':
          description: SBOM summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SbomListResponse' }
  /sboms/{sbom_id}:
    parameters:
      - name: sbom_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getSbom
      summary: Get an SBOM and its dependency graph
      parameters:
        - name: view
          in: query
          schema: { type: string, enum: [display, full], default: display }
      responses:
        '200':
          description: Display-ready SBOM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sbom' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sboms/{sbom_id}/export:
    parameters:
      - name: sbom_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: exportSbom
      summary: Export one SBOM in the user-confirmed format
      parameters:
        - name: format
          in: query
          required: true
          schema: { type: string, enum: [cyclonedx, spdx] }
      responses:
        '200':
          description: CycloneDX or SPDX JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}/vulnerabilities:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectVulnerabilities
      summary: List vulnerability findings and coverage
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
        - { name: severity, in: query, schema: { type: string, enum: [critical, high, medium, low] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VulnerabilityStatus' } }
      responses:
        '200':
          description: Vulnerability findings; an empty list is authoritative only for repositories in analyzed_repository_ids
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VulnerabilityListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects/{project_id}/vulnerabilities/{finding_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/FindingId' }
    get:
      operationId: getVulnerabilityDetail
      summary: Get vulnerability evidence, dependency paths and processing history
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Vulnerability detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VulnerabilityDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/vulnerabilities/{finding_id}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/FindingId' }
    patch:
      operationId: updateVulnerabilityStatus
      summary: Update the disposition of one vulnerability finding
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VulnerabilityStatusInput' }
      responses:
        '200':
          description: Updated vulnerability finding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VulnerabilityFinding' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}/licenses:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getProjectLicenses
      summary: Get license findings, conflict evidence and coverage
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
        - { name: view, in: query, schema: { type: string, enum: [full, coverage], default: full } }
      responses:
        '200':
          description: License governance result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseGovernanceResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects/{project_id}/license-findings/{finding_id}/policy:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/FindingId' }
    patch:
      operationId: updateLicenseFindingPolicy
      summary: Save the policy conclusion and remediation requirements for one component
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicensePolicyUpdateInput' }
      responses:
        '200':
          description: Updated license finding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseFinding' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}/license-conflicts/{conflict_id}/resolution:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ConflictId' }
    get:
      operationId: getLicenseConflictResolution
      summary: Get explanatory resolution recommendations for one conflict
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Resolution recommendations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseResolution' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/license-conflicts/{conflict_id}/status:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ConflictId' }
    patch:
      operationId: updateLicenseConflictStatus
      summary: Update a license conflict to pending confirmation, unresolved, or resolved
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenseConflictStatusInput' }
      responses:
        '200':
          description: Updated license conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenseConflict' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /projects/{project_id}/license-conflicts/{conflict_id}/archive:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - { $ref: '#/components/parameters/ConflictId' }
    post:
      operationId: archiveLicenseConflict
      summary: Archive a resolved license conflict
      description: Only resolved conflicts may be archived. Archived conflicts are omitted from the default conflict list but retained in audit history.
      responses:
        '204': { description: Conflict archived }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{project_id}/trends:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getProjectTrends
      summary: Get health and newly detected vulnerability trends
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\\d{4}-\\d{2}$' } }
        - { name: repository_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Monthly trend points
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HealthTrendPoint' } }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects/{project_id}/maintainer-health:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getMaintainerHealth
      summary: Get maintainer and collaboration evidence used by health assessment
      parameters:
        - { name: repository_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Maintainer health evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintainerHealth' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /projects/{project_id}/reports:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectReports
      summary: List historical reports for the four fixed analysis capabilities
      responses:
        '200':
          description: Historical reports
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectReport' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/reports/{report_id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
      - name: report_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getProjectReport
      summary: Get one historical report and its evidence references
      responses:
        '200':
          description: Historical report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectReport' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/audit-records:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectAuditRecords
      summary: List immutable project audit records
      description: Audit records cover state-changing project, repository, vulnerability, license, report and review actions; ordinary analysis progress is not an audit record.
      responses:
        '200':
          description: Audit records
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditRecord' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/activities:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: listProjectActivities
      summary: List source-hosting activities for project repositories
      description: Only upstream commits and merged pull requests are returned. Internal platform events are excluded.
      responses:
        '200':
          description: Repository activities
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProjectActivityRecord' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{project_id}/review:
    parameters:
      - { $ref: '#/components/parameters/ProjectId' }
    get:
      operationId: getProjectReview
      summary: Get the current expert review
      responses:
        '200':
          description: Expert review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectReviewRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateProjectReview
      summary: Save human dimension scores, final conclusion and recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectReviewInput' }
      responses:
        '200':
          description: Updated expert review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectReviewRecord' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /platform/operations:
    get:
      operationId: getPlatformOperations
      summary: Get platform service, queue and data-source state
      responses:
        '200':
          description: Platform operations snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformOperationsSnapshot' }
  /notifications:
    get:
      operationId: listNotifications
      summary: List notifications generated by implemented platform functions
      responses:
        '200':
          description: Notifications visible to the current user
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlatformNotification' } }
  /notifications/{notification_id}/read:
    parameters:
      - name: notification_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformNotification' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark all visible notifications as read
      responses:
        '200':
          description: Number of updated notifications
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer, minimum: 0 }
  /events:
    get:
      operationId: subscribeEvents
      summary: Subscribe to live job and run state changes
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
      responses:
        '200':
          description: Server-sent event stream. Clients must query resource state after reconnecting.
          content:
            text/event-stream:
              schema: { type: string }
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      servers: [{ url: / }]
      security: []
      responses:
        '200': { description: Service is live }
        '400': { description: Invalid probe request }
        '503': { description: Service is unavailable }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: oss_session
      description: HttpOnly session established by the OIDC Authorization Code + PKCE flow.
  responses:
    Unauthorized:
      description: The browser session is absent or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidRequest:
      description: Query or header validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: The project is unavailable, outside the current scope, or past its deletion deadline.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The command conflicts with the current resource version, name, or lifecycle state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnprocessableEntity:
      description: The request fields fail validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: The capability exists in the product contract but its analysis provider is unavailable or has not produced a result.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ProjectId: { name: project_id, in: path, required: true, schema: { type: string } }
    RepositoryId: { name: repository_id, in: path, required: true, schema: { type: string } }
    ModuleId: { name: module_id, in: path, required: true, schema: { type: string } }
    RunId: { name: run_id, in: path, required: true, schema: { type: string } }
    FindingId: { name: finding_id, in: path, required: true, schema: { type: string } }
    ConflictId: { name: conflict_id, in: path, required: true, schema: { type: string } }
    RunView:
      name: view
      in: query
      schema: { type: string, enum: [summary, full], default: summary }
  schemas:
    UserProfile:
      type: object
      required: [id, display_name, roles]
      properties:
        id: { type: string }
        display_name: { type: string }
        roles: { type: array, items: { type: string } }
    MeResponse:
      type: object
      required: [user, permissions, project_scope, session_expires_at, request_id]
      properties:
        user: { $ref: '#/components/schemas/UserProfile' }
        permissions: { type: array, items: { type: string } }
        project_scope: { type: array, items: { type: string } }
        session_expires_at: { type: string, format: date-time }
        request_id: { type: string }
    ProjectInput:
      type: object
      description: All three fields must be strings. Owner and description may be empty. Trim fields before saving. Length limits follow the current browser's UTF-16 code-unit counting; any alternative counting rule requires coordinated client changes.
      required: [name, description, owner]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Must be nonempty after trimming. Generate a globally unique comparison key using trim, Unicode NFKC normalization, and lowercase. Archived projects continue to reserve their names until permanent cleanup completes.
        description: { type: string, maxLength: 1000 }
        owner:
          type: string
          maxLength: 80
          description: Display text only, not an account ID, authorization subject, or notification destination.
    ProjectUpdateInput:
      allOf:
        - { $ref: '#/components/schemas/ProjectInput' }
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 1
              description: The version last read by the client. Check it atomically with the update; do not silently overwrite newer data.
            status:
              type: string
              enum: [active, archived]
              description: Omission retains the current status. An archived project only accepts restoration to active before its deletion deadline.
    Project:
      allOf:
        - { $ref: '#/components/schemas/ProjectInput' }
        - type: object
          required: [id, status, archived_at, scheduled_deletion_at, version, repository_count, ready_repository_count, analyzed_repository_count, vulnerability_repository_count, license_repository_count, last_analysis_at, created_at, updated_at]
          properties:
            id: { type: string }
            status: { type: string, enum: [active, archived] }
            archived_at:
              type: [string, 'null']
              format: date-time
              description: Server-generated UTC archive time, null while active. Clients must not set this field.
            scheduled_deletion_at:
              type: [string, 'null']
              format: date-time
              description: Server-generated UTC deadline, exactly 90 days after archived_at; null while active. Restoring clears the old deadline; archiving again creates a new one.
            version: { type: integer, minimum: 1 }
            repository_count: { type: integer, minimum: 0 }
            ready_repository_count: { type: integer, minimum: 0 }
            analyzed_repository_count: { type: integer, minimum: 0 }
            vulnerability_repository_count: { type: integer, minimum: 0 }
            license_repository_count: { type: integer, minimum: 0 }
            last_analysis_at: { type: [string, 'null'], format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    CreateRepositoryInput:
      type: object
      required: [project_id, url]
      properties:
        project_id: { type: string }
        url:
          type: string
          format: uri
          description: Complete public HTTPS repository URL from a supported source host, currently GitHub, Gitee, AtomGit, or GitCode.
        reference:
          type: string
          maxLength: 255
          description: Branch or tag. Omission selects the upstream default branch.
        description: { type: string, maxLength: 500 }
    CreateRepositoryResponse:
      type: object
      required: [repository, job_id]
      properties:
        repository: { $ref: '#/components/schemas/Repository' }
        job_id: { type: string }
    UpdateRepositoryNoteInput:
      type: object
      additionalProperties: false
      required: [description, expected_description]
      properties:
        description:
          type: [string, 'null']
          maxLength: 500
          description: Local connection note. Trim surrounding whitespace; an empty string or null clears the note.
        expected_description:
          type: [string, 'null']
          description: Exact note observed before editing. A mismatch returns repository_note_conflict (409).
    Repository:
      type: object
      required: [id, project_id, canonical_url, requested_ref, resolved_sha, state, sync_state, active_job_id, latest_job_id, last_successful_sync_at, description, last_error, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        canonical_url: { type: string, format: uri }
        requested_ref: { type: [string, 'null'] }
        resolved_sha: { type: [string, 'null'] }
        state: { type: string, enum: [pending, ready, failed] }
        sync_state: { type: string, enum: [idle, queued, running, failed] }
        active_job_id: { type: [string, 'null'] }
        latest_job_id: { type: [string, 'null'] }
        last_successful_sync_at: { type: [string, 'null'], format: date-time }
        description: { type: [string, 'null'] }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Job:
      type: object
      required: [id, kind, repository_id, state, progress, stage, error_code, error_message, created_at, updated_at]
      properties:
        id: { type: string }
        kind:
          type: string
          description: Stable job kind such as repository_prepare; clients must render unknown future kinds safely.
        repository_id: { type: string }
        state: { type: string, enum: [queued, running, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stage: { type: string }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InventoryFile:
      type: object
      required: [path, role, language, size, sha256, flags]
      properties:
        id: { type: integer }
        repository_id: { type: string }
        path: { type: string }
        role: { type: string }
        language: { type: [string, 'null'] }
        size: { type: integer, minimum: 0 }
        sha256: { type: string }
        flags: { type: [string, 'null'] }
    Inventory:
      type: object
      required: [summary, files]
      properties:
        summary:
          type: object
          required: [languages, manifest_evidence, language_evidence, role_counts, total_files, total_bytes, scanned_files, skipped_files, skipped_by_reason, unknown_files, rule_set_version]
          properties:
            languages: { type: object, additionalProperties: { type: integer } }
            manifest_evidence: { type: object, additionalProperties: { type: string } }
            language_evidence: { type: object, additionalProperties: { type: integer } }
            role_counts: { type: object, additionalProperties: { type: integer } }
            total_files: { type: integer, minimum: 0 }
            total_bytes: { type: integer, minimum: 0 }
            scanned_files: { type: integer, minimum: 0 }
            skipped_files: { type: integer, minimum: 0 }
            skipped_by_reason: { type: object, additionalProperties: { type: integer } }
            unknown_files: { type: integer, minimum: 0 }
            rule_set_version: { type: string }
        files:
          type: array
          items: { $ref: '#/components/schemas/InventoryFile' }
    AnalysisInput:
      type: object
      additionalProperties: false
      required: [repository_ids, module_id]
      properties:
        repository_ids:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items: { type: string }
        module_id:
          type: string
          description: Identifier of one of the four platform-managed modules.
    AnalysisAutomationRule:
      type: object
      additionalProperties: false
      required: [module_id, automatic_enabled, cadence, run_on_repository_update]
      properties:
        module_id: { type: string }
        automatic_enabled: { type: boolean }
        cadence: { type: string, enum: [daily, weekly, monthly] }
        run_on_repository_update: { type: boolean }
    ProjectAnalysisSettings:
      type: object
      required: [project_id, rules, updated_at]
      properties:
        project_id: { type: string }
        rules:
          type: array
          minItems: 4
          maxItems: 4
          description: Exactly one rule for each fixed analysis capability.
          items: { $ref: '#/components/schemas/AnalysisAutomationRule' }
        updated_at: { type: string, format: date-time }
    UpdateProjectAnalysisSettingsInput:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/AnalysisAutomationRule' }
    AnalysisRepository:
      type: object
      required: [repository_id, repository_name, commit_sha]
      properties:
        repository_id: { type: string }
        repository_name: { type: string }
        commit_sha: { type: string }
    ProjectAnalysis:
      type: object
      required: [id, project_id, module_id, state, progress, repositories, run_ids, created_at, updated_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        module_id: { type: string }
        state: { type: string, enum: [queued, running, completed, partial, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        repositories:
          type: array
          items: { $ref: '#/components/schemas/AnalysisRepository' }
        run_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ModuleRequirements:
      type: object
      required: [required_roles, languages, include_globs, exclude_globs, requires_git_history, requires_full_repository, max_files, max_bytes]
      properties:
        required_roles: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        include_globs: { type: array, items: { type: string } }
        exclude_globs: { type: array, items: { type: string } }
        requires_git_history: { type: boolean }
        requires_full_repository: { type: boolean }
        max_files: { type: [integer, 'null'], minimum: 1 }
        max_bytes: { type: [integer, 'null'], minimum: 1 }
    ModuleDefinition:
      type: object
      required: [id, name, version, description, endpoint, health_endpoint, enabled, timeout_seconds, delivery_mode, requirements, managed_by_platform]
      properties:
        id: { type: string }
        name:
          type: string
          enum: [sbom-generator, vulnerability-scanner, license-scanner, health-evaluator]
        version: { type: string }
        description: { type: [string, 'null'] }
        endpoint: { type: string, format: uri }
        health_endpoint: { type: [string, 'null'], format: uri }
        enabled: { type: boolean }
        timeout_seconds: { type: integer, minimum: 1 }
        delivery_mode: { type: string, enum: [manifest, archive, both] }
        requirements: { $ref: '#/components/schemas/ModuleRequirements' }
        managed_by_platform:
          type: boolean
          const: true
          description: Users may enable or disable modules but cannot register, replace, or delete them.
    ModuleHealth:
      type: object
      required: [module_id, state, checked_at]
      properties:
        module_id: { type: string }
        state: { type: string, enum: [healthy, degraded, unavailable] }
        checked_at: { type: string, format: date-time }
        message: { type: [string, 'null'] }
    RunInput:
      type: object
      additionalProperties: false
      required: [module_id]
      properties:
        module_id: { type: string }
    ModuleSnapshot:
      type: object
      required: [name, version, requirements, delivery_mode]
      properties:
        name: { type: string }
        version: { type: string }
        requirements: { $ref: '#/components/schemas/ModuleRequirements' }
        delivery_mode: { type: string, enum: [manifest, archive, both] }
    Run:
      type: object
      required: [id, project_id, analysis_id, result_sbom_id, repository_id, module_id, commit_sha, state, selected_files, artifact_id, artifact_url, response_status, response_headers, error_code, error_message, duration_ms, created_at, updated_at]
      properties:
        id: { type: string }
        run_id: { type: string, description: Transitional alias; consumers should use id. }
        project_id: { type: string }
        analysis_id: { type: [string, 'null'] }
        result_sbom_id: { type: [string, 'null'] }
        repository_id: { type: string }
        module_id: { type: string }
        commit_sha: { type: [string, 'null'] }
        state: { type: string, enum: [queued, running, completed, failed] }
        details_deferred: { type: boolean, default: true }
        result_status: { type: [string, 'null'], enum: [completed, partial_success, failed, null] }
        output_artifact_ids: { type: array, items: { type: string } }
        module_snapshot: { $ref: '#/components/schemas/ModuleSnapshot' }
        selected_files: { type: integer, minimum: 0 }
        selected_inputs:
          type: array
          description: Present only when view=full; use the paged inputs endpoint otherwise.
          items: { $ref: '#/components/schemas/InventoryFile' }
        artifact_id: { type: [string, 'null'] }
        artifact_url: { type: [string, 'null'], format: uri-reference }
        response_status: { type: [integer, 'null'] }
        response_headers: { type: [object, 'null'], additionalProperties: { type: string } }
        response_body:
          type: [string, 'null']
          description: Present only when view=full; use the response endpoint otherwise.
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        duration_ms: { type: [integer, 'null'], minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RunInputPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/InventoryFile' } }
        total: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
    RunResponsePreview:
      type: object
      required: [response_body, response_headers, truncated, total_bytes]
      properties:
        response_body: { type: string }
        response_headers: { type: [object, 'null'], additionalProperties: { type: string } }
        truncated: { type: boolean }
        total_bytes: { type: integer, minimum: 0 }
    Severity:
      type: string
      enum: [critical, high, medium, low]
    SbomCoverage:
      type: object
      properties:
        transitive_dependencies_resolved: { type: boolean }
        transitive_resolution_status: { type: string, enum: [completed, partial, not_run] }
        analysis_mode: { type: string }
        graph_reports:
          type: array
          items:
            type: object
            required: [manifest_path, status, issues]
            properties:
              manifest_path: { type: string }
              status: { type: string }
              issues: { type: array, items: { type: string } }
    SbomSummary:
      type: object
      required: [id, project_id, repository_id, repository_name, scope, analysis_id, commit_sha, format, status, generated_at, generator, component_count, direct_dependency_count, transitive_dependency_count, dependency_depth, generation_ms, sha256, vulnerability_analysis_status]
      properties:
        id: { type: string }
        project_id: { type: string }
        repository_id: { type: [string, 'null'] }
        repository_name: { type: string }
        scope: { type: string, enum: [project, repository] }
        analysis_id: { type: [string, 'null'] }
